<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>
    <!-- CTRL + / -->
    <!-- Unordered list -->
    <ul>
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
        <li>Nairobi</li>
        <li>Lusaka</li>
    </ul>

    <!-- Ordered list  type 1, a , A, i-->
    <ol type="a">
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
        <li>Nairobi</li>
        <li>Lusaka</li>
    </ol>


</body>

</html>
