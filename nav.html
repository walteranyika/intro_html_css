<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap');

        *{
            padding: 0;
            margin: 0;
        }

        body {
            font-family: "Mona Sans", sans-serif;
            font-optical-sizing: auto;
            margin: 0;
        }

        nav {
            display: flex;
            justify-content: center;
            /* background: #c1c1c1; */
            border-bottom: 1px solid #c1c1c1;
        }

        .content {
            /* background: #edf064; */
            width: 70%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            width: 70px;
            height: 70px;
        }

        .content ul {
            display: flex;
            /* remove bullets */
            list-style-type: none;
        }

        .content li {
            margin-left: 16px;
            margin-right: 16px;
        }

        .content a {
            text-decoration: none;
            color: #000;
            padding: 12px 14px;
            text-transform: capitalize;
        }

        .content a:hover{
           /* color: #504f4f;  */
           background: #dbd7d7;
           /* text-decoration: underline; */
           border-bottom: 1px solid #000;
        }

        /* git add . */
        /* git commit -m "built the navbar" */
        /* git push  */
    </style>
</head>

<body>

    <nav>
        <div class="content">
            <div class="logo">
                <img src="images/icons8-lorry-100.png" alt="logo">
            </div>
            <ul>
                <li><a href="#">home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">pricing</a></li>
                <li><a href="#">Get Help</a></li>
                <li><a href="#">team</a></li>
            </ul>
        </div>
    </nav>



</body>

</html>
