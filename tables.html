<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tables</title>

	<style>
		body {
			background: #b3b1b1;
			font-family: FreeSans, sans-serif;
		}

		table {
			border: 2px solid #0c0c0c;
			border-collapse: collapse;
			width: 61%;
			margin: auto;
		}

		th {
			border: 1px solid #0c0c0c;
			padding-top: 10px;
			padding-bottom: 8px;
			text-align: left;
			background: gray;
			color: white;
			padding-left: 8px;
		}

		td {
			border: 1px solid #0c0c0c;
			padding: 10px;
		}

		.dob-column {
			color: #046868;
		}

		/* Github copilot */
	</style>
</head>

<body>

	<table>
		<thead>
			<tr>
				<th>First Name</th>
				<th>Last Name</th>
				<th>Email</th>
				<th class="dob-column">DOB</th>
				<th>Gender</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td>Jane</td>
				<td>Doe</td>
				<td>jane@yahoo.com</td>
				<td class="dob-column">19-10-2008</td>
				<td>F</td>
			</tr>

			<tr>
				<td>Jack</td>
				<td>Jill</td>
				<td>jack@yahoo.com</td>
				<td class="dob-column">19-12-2018</td>
				<td>M</td>
			</tr>

			<tr>
				<td>John</td>
				<td>Doe</td>
				<td>john@yahoo.com</td>
				<td class="dob-column">19-05-2005</td>
				<td>M</td>
			</tr>

			<tr>
				<td>Jane</td>
				<td>Doe</td>
				<td>jane@yahoo.com</td>
				<td class="dob-column">19-10-2008</td>
				<td>F</td>
			</tr>

		</tbody>
	</table>

</body>

</html>
